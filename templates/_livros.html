<div class="book-grid">{% for livro in livros %}<article class="book-card"><a class="cover" href="{{ url_for('detalhe_livro', livro_id=livro.id) }}">{% if livro.capa %}<img src="{{ livro.capa }}" alt="Capa de {{ livro.titulo }}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">{% endif %}<span {% if livro.capa %}style="display:none"{% endif %}>{{ livro.titulo[:1] }}</span></a><div class="book-info"><span class="tag">{{ livro.genero }}</span><h3><a href="{{ url_for('detalhe_livro', livro_id=livro.id) }}">{{ livro.titulo }}</a></h3><p>{{ livro.autor }}</p><p>{{ livro.ano or 'Clássico' }} · {{ livro.paginas }} páginas</p><a class="text-link" href="{{ url_for('detalhe_livro', livro_id=livro.id) }}">Ver livro →</a></div></article>{% else %}<p>Nenhum livro encontrado. Tente outra busca.</p>{% endfor %}</div>
